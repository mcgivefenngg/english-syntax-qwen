[project]
name = "english-syntax-qwen"
version = "0.1.0"
description = "Reproducible Qwen3.5 English Syntax Tutor fine-tuning workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.14.0",
    "bitsandbytes==0.50.2",
    "datasets==4.3.0",
    "huggingface-hub==1.29.0",
    "peft==0.20.0",
    "pillow>=10.0.1,<16.0",
    "protobuf>=5.0,<7.0",
    "qwen-vl-utils==0.0.14",
    "safetensors==0.8.0",
    "sentencepiece>=0.2.0,<0.3.0",
    "tensorboard==2.21.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.5.0",
    "trl==0.24.0",
    "triton==3.6.0",
    "unsloth[base]==2026.8.22",
    "unsloth-zoo[base]==2026.8.16",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
