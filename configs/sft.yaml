model_name: Qwen/Qwen3.5-4B
train_file: data/splits/train.jsonl
eval_file: data/splits/eval.jsonl
output_dir: outputs/qwen3.5-4b-english-syntax-lora
max_seq_length: 4096
load_in_4bit: false
torch_dtype: bfloat16
finetune_vision_layers: false
