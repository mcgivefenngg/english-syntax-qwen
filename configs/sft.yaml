finetune_attention_modules: true
finetune_mlp_modules: true
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.0
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 1
learning_rate: 0.0002
warmup_ratio: 0.03
weight_decay: 0.001
logging_steps: 1
save_steps: 100
eval_steps: 100
seed: 3407
